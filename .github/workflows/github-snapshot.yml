# Refreshes the public GitHub activity snapshot shown on the home page (fig. 1 and the
# terminal panel). A push to main makes Vercel redeploy the site with the new data.
name: Refresh GitHub snapshot

on:
  schedule:
    - cron: '17 4 * * *' # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The script refuses to write if the calendar does not add up, so a bad
      # fetch fails the job and leaves the committed snapshot untouched.
      - name: Fetch snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-snapshot.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/github-snapshot.json; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-snapshot.json
          git commit -m "chore: refresh GitHub activity snapshot"
          git push
